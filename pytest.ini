[pytest]
testpaths = tests
addopts = -ra --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results --html=reports/report.html --self-contained-html
markers =
    smoke: fast checks that the critical path works
    regression: fuller functional coverage
    negative: invalid input and error handling
    api: HTTP API tests (no browser)
    a11y: accessibility checks (WCAG 2.1 AA)
    security: authorisation, input-abuse and data-exposure checks
    performance: response-time and load-time thresholds
    provisional: runs only under a documented assumption
