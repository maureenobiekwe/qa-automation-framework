name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest -n auto
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-report
          path: reports/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traces-and-screenshots
          path: test-results/
